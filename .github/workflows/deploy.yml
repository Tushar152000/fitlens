name: Deploy

# After CI passes on main: build images, run database migrations, then roll out.
# API → Google Cloud Run (asia-south1). One-time setup: infra/gcp/setup.sh, which creates everything and sets
# these repository variables (Settings → Secrets and variables → Actions → Variables):
#   GCP_PROJECT_ID, GCP_REGION, GCP_WIF_PROVIDER, GCP_DEPLOYER_SA, GCP_RUNTIME_SA, GCP_SQL_CONNECTION,
#   S3_BUCKET, PUBLIC_URL
# GitHub signs in to Google with OIDC (Workload Identity Federation); there are no service account keys.
# App secrets (database, auth, Anthropic, Cloudflare R2) live only in Secret Manager and are mounted by name:
# nothing secret is stored in GitHub or printed in logs. Extra env set in the Cloud Run console
# (AI_DAILY_LIMIT, CORS_ORIGINS, OFF_CONTACT…) survives deploys: this workflow only updates what it lists.
#   secrets.WEB_DEPLOY_HOOK_URL  optional: deploy hook for the web image (skip if web is on Vercel)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/fitlens

jobs:
  api-images:
    if: ${{ vars.GCP_PROJECT_ID != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      # Same Dockerfile, two targets: the API runtime and the `prisma migrate deploy` release step.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/api:${{ env.SHA }},${{ env.REGISTRY }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          push: true
          tags: ${{ env.REGISTRY }}/migrate:${{ env.SHA }}
          cache-from: type=gha,scope=api

  migrate:
    needs: api-images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      # Runs inside Google next to the database (Cloud SQL socket), so the database has no public access.
      # The same job seeds foods/exercises once: gcloud run jobs execute fitlens-migrate --args=npx,prisma,db,seed
      - name: prisma migrate deploy
        run: >-
          gcloud run jobs deploy fitlens-migrate
          --project=${{ vars.GCP_PROJECT_ID }} --region=${{ vars.GCP_REGION }}
          --image=${{ env.REGISTRY }}/migrate:${{ env.SHA }}
          --service-account=${{ vars.GCP_RUNTIME_SA }}
          --set-cloudsql-instances=${{ vars.GCP_SQL_CONNECTION }}
          --set-secrets=DATABASE_URL=DATABASE_URL:latest
          --max-retries=0 --task-timeout=10m
          --execute-now --wait

  api:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      # db-f1-micro allows 25 connections: DATABASE_POOL_MAX (5) × max instances (3) leaves room for migrations.
      - name: Deploy to Cloud Run
        run: >-
          gcloud run deploy fitlens-api
          --project=${{ vars.GCP_PROJECT_ID }} --region=${{ vars.GCP_REGION }}
          --image=${{ env.REGISTRY }}/api:${{ env.SHA }}
          --service-account=${{ vars.GCP_RUNTIME_SA }}
          --allow-unauthenticated
          --port=4000 --cpu=1 --memory=512Mi --concurrency=40 --timeout=300
          --min-instances=0 --max-instances=3
          --set-cloudsql-instances=${{ vars.GCP_SQL_CONNECTION }}
          --startup-probe=httpGet.path=/api/health/live,periodSeconds=2,failureThreshold=15
          --liveness-probe=httpGet.path=/api/health/live,periodSeconds=30
          --update-env-vars=APP_ENV=production,APP_ROLE=api,PUBLIC_URL=${{ vars.PUBLIC_URL }},DATABASE_POOL_MAX=5,AI_PROVIDER=anthropic,S3_REGION=auto,S3_BUCKET=${{ vars.S3_BUCKET }},S3_FORCE_PATH_STYLE=true
          --update-secrets=DATABASE_URL=DATABASE_URL:latest,AUTH_SECRET=AUTH_SECRET:latest,AUTH_GOOGLE_ID=AUTH_GOOGLE_ID:latest,AUTH_GOOGLE_SECRET=AUTH_GOOGLE_SECRET:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,S3_ENDPOINT=S3_ENDPOINT:latest,S3_ACCESS_KEY_ID=S3_ACCESS_KEY_ID:latest,S3_SECRET_ACCESS_KEY=S3_SECRET_ACCESS_KEY:latest
      - name: Smoke test
        run: |
          url="$(gcloud run services describe fitlens-api --project=${{ vars.GCP_PROJECT_ID }} --region=${{ vars.GCP_REGION }} --format='value(status.url)')"
          curl -fsS "$url/api/health"
          echo
          echo "API: $url  (set the web app's API_INTERNAL_URL to this)" >> "$GITHUB_STEP_SUMMARY"

  # After the API so new pages never call endpoints that aren't live yet (still runs if the API is not on GCP).
  web:
    needs: [api-images, migrate, api]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Trigger deploy hook
        env:
          WEB_HOOK: ${{ secrets.WEB_DEPLOY_HOOK_URL }}
        run: |
          [ -n "$WEB_HOOK" ] && curl -fsS -X POST "$WEB_HOOK" && echo "Web deploy triggered" || echo "No web hook configured"
