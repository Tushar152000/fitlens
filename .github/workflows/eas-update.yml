name: EAS Update (mobile OTA)

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/contracts/**"

concurrency:
  group: eas-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run build --filter=@fitr8/contracts

      # The commit message goes in through env, never pasted into the script: quotes in it broke the
      # command, and inlined ${{ }} text is a script-injection risk. Only its first line is used.
      - name: Publish update
        working-directory: apps/mobile
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: eas update --branch preview --message "$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)" --non-interactive
