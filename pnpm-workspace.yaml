packages:
  - apps/*
  - packages/*

# Prisma, esbuild and friends run install scripts; everything else is blocked by default.
onlyBuiltDependencies:
  - "@prisma/engines"
  - prisma
  - esbuild
  - "@nestjs/core"
  - "@swc/core"
  - sharp
  - unrs-resolver
  - msgpackr-extract

# read-excel-file (packages/db INDB converter) accepts worker-f ^0.1.12; pin a release old enough for
# Dependabot's minimum-release-age check (0.1.25 was too new and failed every Dependabot run).
overrides:
  worker-f: 0.1.21
